{% extends "base.html" %}
{% block title %}Predict – AutoPrice AI{% endblock %}
{% block content %}
<div class="page-header">
  <h2>🔍 Vehicle Price Prediction</h2>
  <p>Select all details below to get an estimated price</p>
</div>

<div class="predict-card">
  <form id="predict-form">
    <div class="grid">

      <div class="field">
        <label>Make</label>
        <select id="make" required>
          <option value="">Select Make</option>
          <option>Toyota</option><option>Honda</option><option>Ford</option>
          <option>BMW</option><option>Mercedes</option><option>Audi</option>
          <option>Chevrolet</option><option>Hyundai</option><option>Nissan</option>
          <option>Kia</option><option>Mazda</option><option>Volkswagen</option>
          <option>Subaru</option><option>Tesla</option>
          <option>Tata</option><option>Renault</option>
        </select>
      </div>

      <div class="field">
        <label>Model</label>
        <select id="model" required>
          <option value="">Select Model</option>
        </select>
      </div>

      <div class="field">
        <label>Year</label>
        <select id="year" required>
          <option value="">Select Year</option>
        </select>
      </div>

      <div class="field">
        <label>Engine Size (L)</label>
        <select id="engine_size" required>
          <option value="">Select Engine Size</option>
        </select>
      </div>

      <div class="field">
        <label>Mileage (km)</label>
        <select id="mileage" required>
          <option value="">Select Mileage</option>
          <option value="5000">5,000 km</option>
          <option value="10000">10,000 km</option>
          <option value="15000">15,000 km</option>
          <option value="20000">20,000 km</option>
          <option value="25000">25,000 km</option>
          <option value="30000">30,000 km</option>
          <option value="35000">35,000 km</option>
          <option value="40000">40,000 km</option>
          <option value="45000">45,000 km</option>
          <option value="50000">50,000 km</option>
          <option value="60000">60,000 km</option>
          <option value="70000">70,000 km</option>
          <option value="80000">80,000 km</option>
          <option value="90000">90,000 km</option>
          <option value="100000">1,00,000 km</option>
          <option value="120000">1,20,000 km</option>
          <option value="150000">1,50,000 km</option>
        </select>
      </div>

      <div class="field">
        <label>Transmission</label>
        <select id="transmission" required>
          <option value="">Select</option>
          <option>Automatic</option>
          <option>Manual</option>
        </select>
      </div>

      <div class="field">
        <label>Fuel Type</label>
        <select id="fuel_type" required>
          <option value="">Select</option>
          <option>Petrol</option>
          <option>Diesel</option>
          <option>Electric</option>
          <option>Hybrid</option>
        </select>
      </div>

      <div class="field">
        <label>Owner Type</label>
        <select id="owner_type" required>
          <option value="">Select</option>
          <option>First</option>
          <option>Second</option>
          <option>Third</option>
        </select>
      </div>

    </div>
    <button type="submit" class="btn-primary">🔍 Predict Price</button>
  </form>

  <div id="result" class="result hidden">
    <div class="price-box">
      <span class="label">Estimated Price</span>
      <span class="price" id="price-value"></span>
      <span class="model-tag" id="model-tag"></span>
    </div>
  </div>
  <div id="error" class="error hidden"></div>
</div>

<script>
const carData = {
  "Toyota":     { models: ["Camry","Corolla","RAV4","Highlander","Prius","Sienna","4Runner","Tacoma","Sequoia","Venza","Land Cruiser"], years: [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [1.8,2.0,2.5,3.5,4.0,5.7] },
  "Honda":      { models: ["Civic","Accord","CR-V","Pilot","Odyssey","Passport","HR-V","Ridgeline"], years: [2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [1.5,1.8,2.4,3.5] },
  "Ford":       { models: ["Mustang","Focus","F-150","Explorer","Bronco","Expedition","Edge","Fusion","Escape"], years: [2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [1.0,1.5,2.0,2.3,3.5,5.0,5.4] },
  "BMW":        { models: ["3 Series","5 Series","X5","X3","X1","7 Series","i4","X7"], years: [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [0.0,2.0,3.0,4.4] },
  "Mercedes":   { models: ["C-Class","E-Class","ML-Class","GLC","GLE","S-Class"], years: [2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [2.0,3.0,4.7] },
  "Audi":       { models: ["A4","A6","Q5","Q3","A3","A5","e-tron"], years: [2015,2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [0.0,1.8,2.0,3.0] },
  "Chevrolet":  { models: ["Malibu","Cruze","Equinox","Tahoe","Traverse","Impala","Blazer","Silverado"], years: [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023], engines: [1.4,1.5,2.5,3.6,5.3] },
  "Hyundai":    { models: ["Elantra","Sonata","Tucson","Santa Fe","Ioniq 5","Palisade"], years: [2016,2017,2018,2019,2020,2021,2022,2023,2024], engines: [0.0,2.0,2.4,3.8] },
  "Nissan":     { models: ["Altima","Sentra","Rogue","Pathfinder","Murano","Maxima","Frontier"], years: [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023], engines: [1.8,2.5,3.5,3.8] },
  "Kia":        { models: ["Optima","Sorento","Sportage","Telluride","EV6","Stinger"], years: [2017,2018,2019,2020,2021,2022,2023,2024], engines: [0.0,2.0,2.4,3.8] },
  "Mazda":      { models: ["Mazda6","CX-5","CX-9","Mazda3","MX-5","CX-3"], years: [2015,2016,2017,2018,2019,2020,2021,2022,2023], engines: [2.0,2.5] },
  "Volkswagen": { models: ["Passat","Tiguan","Atlas","Jetta","Golf"], years: [2013,2014,2015,2016,2017,2018,2019,2020,2021,2022], engines: [1.4,1.8,2.0,3.6] },
  "Subaru":     { models: ["Outback","Forester","Ascent","Impreza","Legacy"], years: [2015,2016,2017,2018,2019,2020,2021,2022,2023], engines: [2.0,2.4,2.5] },
  "Tesla":      { models: ["Model 3","Model Y"], years: [2021,2022,2023,2024,2025], engines: [0.0] },
  "Tata":       { models: ["Nexon","Harrier","Safari","Tiago","Altroz","Punch","Tigor","Curvv"], years: [2017,2018,2019,2020,2021,2022,2023,2024], engines: [1.2,1.5,2.0] },
  "Renault":    { models: ["Kwid","Duster","Triber","Kiger","Lodgy","Captur"], years: [2016,2017,2018,2019,2020,2021,2022,2023], engines: [1.0,1.5] },
};

function setOptions(sel, opts, labelFn) {
  const prev = sel.value;
  sel.innerHTML = `<option value="">Select</option>`;
  opts.forEach(o => {
    const v = o;
    const l = labelFn ? labelFn(o) : o;
    sel.innerHTML += `<option value="${v}" ${v==prev?'selected':''}>${l}</option>`;
  });
}

document.getElementById("make").addEventListener("change", function() {
  const d = carData[this.value] || {};
  setOptions(document.getElementById("model"), d.models || [], null);
  setOptions(document.getElementById("year"), (d.years || []).slice().reverse(), null);
  setOptions(document.getElementById("engine_size"), d.engines || [], e => e === 0.0 ? "Electric (0.0)" : e + " L");
});

document.getElementById("model").addEventListener("change", function() {
  const make = document.getElementById("make").value;
  const d = carData[make] || {};
  setOptions(document.getElementById("year"), (d.years || []).slice().reverse(), null);
  setOptions(document.getElementById("engine_size"), d.engines || [], e => e === 0.0 ? "Electric (0.0)" : e + " L");
});

document.getElementById("predict-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const result   = document.getElementById("result");
  const errorDiv = document.getElementById("error");
  result.classList.add("hidden");
  errorDiv.classList.add("hidden");

  const payload = {
    year:         document.getElementById("year").value,
    make:         document.getElementById("make").value,
    model:        document.getElementById("model").value,
    engine_size:  document.getElementById("engine_size").value,
    mileage:      document.getElementById("mileage").value,
    transmission: document.getElementById("transmission").value,
    fuel_type:    document.getElementById("fuel_type").value,
    owner_type:   document.getElementById("owner_type").value,
  };

  try {
    const res  = await fetch("/api/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) {
      errorDiv.textContent = "⚠️ " + data.error;
      errorDiv.classList.remove("hidden");
    } else {
      document.getElementById("price-value").textContent =
        "₹" + data.price.toLocaleString("en-IN", {maximumFractionDigits: 0});
      document.getElementById("model-tag").textContent = "Predicted by: " + data.model;
      result.classList.remove("hidden");
    }
  } catch {
    errorDiv.textContent = "⚠️ Server error. Please try again.";
    errorDiv.classList.remove("hidden");
  }
});
</script>
{% endblock %}
