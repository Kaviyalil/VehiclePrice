name: AutoPrice AI - CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────────────
  test:
    name: ✅ Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dataset & train model
        run: python generate_data.py && python model_training.py

      - name: Test Flask app
        run: |
          python -c "
          import pickle, os
          obj = pickle.load(open('model.pkl','rb'))
          assert 'model_name' in obj
          assert 'encoders' in obj
          print('✅ Model test passed:', obj['model_name'])
          print('✅ Makes:', list(obj['encoders']['Make'].classes_))
          "

  # ── Job 2: Build & Push Docker Image ─────────────────────────────────────────
  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            stuartittle/autoprice-ai:latest
            stuartittle/autoprice-ai:${{ github.sha }}
          build-args: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            FLASK_SECRET=${{ secrets.FLASK_SECRET }}

  # ── Job 3: Deploy to Render ───────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "✅ Deployed to https://autoprice-ai.onrender.com"
